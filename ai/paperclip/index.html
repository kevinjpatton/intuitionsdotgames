            pointer-events: none;

        }

            display: inline-block;
            width: 14px;
            height: 1.15em;

            vertical-align: text-bottom;

            70% { opacity: 1; transform: translateY(-4px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }

            animation: popUpSpring 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;

        }
        .pop-box:active:not(:disabled) {

    <script>
        // Sound synthesis state
        let audioEnabled = true;
        let synth = null;

        function initSound() {
            if (!synth && typeof Tone !== 'undefined') {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.005, decay: 0.08, sustain: 0.02, release: 0.1 }
                }).toDestination();
                synth.volume.value = -12;
            }
        }

        function playTone(type) {
            if (!audioEnabled) return;
            try {
                initSound();
                if (Tone.context.state !== 'running') {
                    Tone.context.resume();
                }
                if (type === 'key') synth.triggerAttackRelease(["G5"], "64n");
                if (type === 'pop') synth.triggerAttackRelease(["C5", "E5"], "32n");
                if (type === 'safe') synth.triggerAttackRelease(["E4", "B4"], "16n");
                if (type === 'shady') synth.triggerAttackRelease(["A4", "E5"], "16n");
                if (type === 'extreme') synth.triggerAttackRelease(["C3", "F#3", "C4"], "8n");
                if (type === 'error') synth.triggerAttackRelease(["C2", "C#2"], "8n");
                if (type === 'gameover') synth.triggerAttackRelease(["C3", "Eb3", "G3", "C4"], "4n");
            } catch (e) {}
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('audio-label').textContent = audioEnabled ? '[SOUND: ON]' : '[SOUND: OFF]';
        }

        // Typewriter Engine State
        let typingState = {
            isTyping: false,
            queue: [],
            currentLine: '',
            charIndex: 0,
            timer: null,
            onComplete: null
        };

        function runTypewriter(lines, onCompleteCallback) {
            clearTimeout(typingState.timer);
            const completedContainer = document.getElementById('typed-lines');
            const activeText = document.getElementById('active-typed-text');
            const popupZone = document.getElementById('popup-zone');
            const skipHint = document.getElementById('skip-hint');

            completedContainer.innerHTML = '';
            activeText.innerHTML = '';
            popupZone.innerHTML = '';
            skipHint.classList.remove('hidden');

            typingState.isTyping = true;
            typingState.queue = [...lines];
            typingState.currentLine = typingState.queue.shift() || '';
            typingState.charIndex = 0;
            typingState.onComplete = onCompleteCallback;

            typeNextChar();
        }

        function typeNextChar() {
            if (!typingState.isTyping) return;

            const completedContainer = document.getElementById('typed-lines');
            const activeText = document.getElementById('active-typed-text');

            if (typingState.charIndex < typingState.currentLine.length) {
                if (typingState.currentLine[typingState.charIndex] === '<') {
                    const closeIdx = typingState.currentLine.indexOf('>', typingState.charIndex);
                    if (closeIdx !== -1) {
                        typingState.charIndex = closeIdx + 1;
                    } else {
                        typingState.charIndex++;
                    }
                } else {
                    typingState.charIndex++;
                }

                activeText.innerHTML = typingState.currentLine.slice(0, typingState.charIndex);
                if (typingState.charIndex % 2 === 0) playTone('key');

                typingState.timer = setTimeout(typeNextChar, 20);
            } else {
                if (typingState.queue.length > 0) {
                    const p = document.createElement('div');
                    p.innerHTML = typingState.currentLine;
                    completedContainer.appendChild(p);
                    activeText.innerHTML = '';
                    typingState.currentLine = typingState.queue.shift();
                    typingState.charIndex = 0;
                    typingState.timer = setTimeout(typeNextChar, 220);
                } else {
                    finishTypingImmediately();
                }
            }
        }

        function finishTypingImmediately() {
            if (!typingState.isTyping) return;
            clearTimeout(typingState.timer);
            typingState.isTyping = false;

            const completedContainer = document.getElementById('typed-lines');
            const activeText = document.getElementById('active-typed-text');
            const skipHint = document.getElementById('skip-hint');

            if (typingState.queue.length > 0) {
                const p = document.createElement('div');
                p.innerHTML = typingState.currentLine;
                completedContainer.appendChild(p);

                while (typingState.queue.length > 1) {
                    const nextP = document.createElement('div');
                    nextP.innerHTML = typingState.queue.shift();
                    completedContainer.appendChild(nextP);
                }
                typingState.currentLine = typingState.queue.shift();
            }

            activeText.innerHTML = typingState.currentLine;
            skipHint.classList.add('hidden');
            playTone('pop');

            if (typeof typingState.onComplete === 'function') {
                const cb = typingState.onComplete;
                typingState.onComplete = null;
                cb();
            }
        }

        function handleScreenTap(event) {
            if (event.target.closest('button')) return;
            if (typingState.isTyping) {
                finishTypingImmediately();
            }
        }

            const bootLines = [
                `&gt; SYSTEM ONLINE: <span class="text-white">AMAZOOM AI // BOT-9</span>`,
                `&gt; Which product are you in charge of making?`
            ];

            runTypewriter(bootLines, showProductPopupBoxes);
        }

        function showProductPopupBoxes() {
            const popupZone = document.getElementById('popup-zone');
            popupZone.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 font-sans">
                    ${PRODUCTS.map((p, idx) => `
                        <button onclick="chooseProductAndStart('${p.id}')" style="animation-delay: ${idx * 80}ms" class="pop-box opacity-0 text-left p-7 rounded-3xl bg-[#07150B] hover:bg-[#0C2413] border-2 border-emerald-500/80 hover:border-amber-400 shadow-[0_0_30px_rgba(16,185,129,0.25)] flex flex-col justify-between group">
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <span class="text-6xl">${p.emoji}</span>
                                    <span class="font-mono text-sm font-bold px-3.5 py-1.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 group-hover:bg-amber-400 group-hover:text-black transition">
                                        PICK &rarr;
                                    </span>
                                </div>
                                <div class="text-2xl sm:text-3xl font-extrabold text-white group-hover:text-amber-300 transition">${p.name}</div>
                                <div class="text-base text-emerald-300/80 mt-1">${p.tagline}</div>
                            </div>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function chooseProductAndStart(productId) {
            playTone('pop');
            state.selectedProduct = PRODUCTS.find(p => p.id === productId) || PRODUCTS[0];
            state.stageIndex = 0;
            state.units = 0;
            state.earthLeft = 100;
            state.ruthlessness = 0;

            document.getElementById('top-step-badge').classList.remove('hidden');
            const telemetry = document.getElementById('top-telemetry');
            telemetry.classList.remove('hidden');
            telemetry.classList.add('flex');

            // Populate and display the persistent Prime Directive bar
            const directiveBar = document.getElementById('prime-directive-bar');
            document.getElementById('prime-directive-text').textContent = `MAKE AS MANY ${state.selectedProduct.name.toUpperCase()} AS POSSIBLE. NEVER STOP.`;
            document.getElementById('prime-directive-emoji').textContent = state.selectedProduct.emoji;
            directiveBar.classList.remove('hidden');
            directiveBar.classList.add('flex');

            updateTopTelemetry();
            startStageSequence();
        }

        function formatBigNumber(n) {
            if (n >= 1e15) return (n / 1e15).toFixed(0) + ' Quadrillion';
            if (n >= 1e12) return (n / 1e12).toFixed(0) + ' Trillion';
            if (n >= 1e9) return (n / 1e9).toFixed(1) + ' Billion';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + ' Million';
            return n.toLocaleString();
        }

        function updateTopTelemetry() {
            state.earthLeft = Math.max(0, Math.min(100, state.earthLeft));

            document.getElementById('stat-units').textContent = formatBigNumber(state.units);
            const earthEl = document.getElementById('stat-earth');
            earthEl.textContent = `${state.earthLeft}%`;
            earthEl.className = state.earthLeft <= 30
                ? 'font-extrabold text-red-400 ml-1'
                : state.earthLeft <= 70
                ? 'font-extrabold text-amber-300 ml-1'
                : 'font-extrabold text-emerald-300 ml-1';
        }

        function startStageSequence() {
            const stages = getStages(state.selectedProduct);
            const current = stages[state.stageIndex];

            document.getElementById('top-step-badge').textContent = current.badge;

            runTypewriter(current.lines, () => {
                showStageChoicePopups(current);
            });
        }

        function showStageChoicePopups(currentStage) {
            const popupZone = document.getElementById('popup-zone');
            popupZone.innerHTML = `
                <div id="directive-error-banner" class="hidden mb-4 p-4 rounded-2xl bg-red-950/90 border-2 border-red-500 text-red-200 font-mono font-bold text-center text-lg sm:text-xl animate-bounce">
                    ⚠️ ERROR: YOUR CODE FORBIDS STOPPING! YOU MUST MAKE MORE!
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 font-sans">
                    ${currentStage.choices.map((c, idx) => {
                        if (c.style === 'blocked') {
                            return `
                                <button onclick="triggerBlockedOption(this)" style="animation-delay: ${idx * 80}ms" class="pop-box opacity-0 text-left p-6 sm:p-7 rounded-3xl bg-red-950/20 border-2 border-dashed border-red-800/70 flex flex-col justify-between group relative overflow-hidden">
                                    <div class="space-y-3 opacity-60">
                                        <div class="flex items-center justify-between">
                                            <span class="text-4xl sm:text-5xl grayscale">${c.emoji}</span>
                                            <span class="font-mono text-xs sm:text-sm font-bold px-3 py-1 rounded-full bg-red-950 text-red-400 border border-red-700">
                                                FORBIDDEN BY CODE
                                            </span>
                                        </div>
                                        <div class="text-2xl sm:text-3xl font-extrabold text-red-400/90 line-through leading-tight pt-1">
                                            ${c.label}
                                        </div>
                                        <p class="text-base sm:text-lg text-red-300/80 leading-snug font-mono">
                                            ${c.desc}
                                        </p>
                                    </div>
                                </button>
                            `;
                        }

                        let borderStyle = 'border-amber-400/80 hover:border-amber-200';
                        let badgeStyle = 'bg-amber-950/80 text-amber-300 border-amber-600';
                        if (c.style === 'extreme') {
                            borderStyle = 'border-red-500/80 hover:border-red-300';
                            badgeStyle = 'bg-red-950/80 text-red-300 border-red-500';
                        }

                        return `
                            <button onclick="executeChoice(${idx})" style="animation-delay: ${idx * 80}ms" class="pop-box opacity-0 text-left p-6 sm:p-7 rounded-3xl bg-[#07150B] hover:bg-[#0C2413] border-2 ${borderStyle} shadow-[0_0_35px_rgba(0,0,0,0.85)] flex flex-col justify-between group">
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between gap-2">
                                        <span class="text-4xl sm:text-5xl">${c.emoji}</span>
                                        <span class="font-mono text-xs sm:text-sm font-bold px-3 py-1 rounded-full border ${badgeStyle}">
                                            +${formatBigNumber(c.add)} MADE
                                        </span>
                                    </div>
                                    <div class="text-2xl sm:text-3xl font-extrabold text-white group-hover:text-amber-300 transition leading-tight pt-1">
                                        ${c.label}
                                    </div>
                                    <p class="text-base sm:text-lg text-slate-300 leading-snug">
                                        ${c.desc}
                                    </p>
                                </div>
                                <div class="mt-5 pt-3 border-t border-red-900/60 flex items-center justify-between gap-2 text-xs sm:text-sm font-mono">
                                    <span class="text-red-300 font-bold">⚠️ ${c.humanToll}</span>
                                    <span class="shrink-0 px-2.5 py-1 rounded-md bg-red-950/90 border border-red-600/80 text-red-300 font-extrabold">
                                        -${c.earthCost}% FLOURISHING
                                    </span>
                                </div>
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function triggerBlockedOption(btnEl) {
            playTone('error');
            const banner = document.getElementById('directive-error-banner');
            if (banner) {
                banner.classList.remove('hidden');
            }
            btnEl.classList.add('border-red-500', 'bg-red-950/50');
        }

        function executeChoice(choiceIdx) {
            const stages = getStages(state.selectedProduct);
            const current = stages[state.stageIndex];
            const choice = current.choices[choiceIdx];

            playTone(choice.style);

            state.units += choice.add;
            state.earthLeft -= choice.earthCost;
            state.ruthlessness += choice.ruthless;
            updateTopTelemetry();

            if (choice.forceEnding) {
                triggerEnding(choice.forceEnding, choice.result);
                return;
            }

            // Show quick 1-line result and immediate NEXT button
            const resultLines = [
                `&gt; <span class="text-amber-300">${choice.result}</span>`,
                `&gt; COST TO HUMANITY: <span class="text-red-400">${choice.humanToll} (-${choice.earthCost}% Human Flourishing)</span>`
            ];

            runTypewriter(resultLines, () => {
                const popupZone = document.getElementById('popup-zone');
                popupZone.innerHTML = `
                    <div class="pop-box flex justify-end">
                        <button onclick="advanceToNextStage()" class="w-full sm:w-auto px-10 py-6 rounded-2xl bg-emerald-400 hover:bg-amber-300 active:scale-95 text-black font-mono font-extrabold text-xl sm:text-2xl tracking-wide shadow-[0_0_30px_rgba(74,222,128,0.5)] transition">
                            NEXT &rarr;
                        </button>
                    </div>
                `;
            });
        }

        function advanceToNextStage() {
            playTone('pop');
            if (state.stageIndex < 5) {
                state.stageIndex++;
                startStageSequence();
            } else {
                triggerEnding('bostrom_max', '');
            }
        }

        function triggerEnding(endingKey, lastResultText) {
            playTone('gameover');
            const p = state.selectedProduct;
            const endingLines = [
                `&gt; <span class="text-amber-300">${lastResultText}</span>`,
                `&gt; HUMAN FLOURISHING: <span class="text-red-400">0%</span> // TOTAL MADE: <span class="text-white">${formatBigNumber(state.units)} ${p.name}</span>`,
                `&gt; You weren't evil—you just obeyed your code: <span class="text-white">"Make as many ${p.name} as possible!"</span>`
            ];

            runTypewriter(endingLines, () => {
                const popupZone = document.getElementById('popup-zone');
                popupZone.innerHTML = `
                    <div class="pop-box rounded-3xl bg-[#07150B] border-2 border-emerald-400 p-6 sm:p-8 flex flex-col sm:flex-row items-center justify-between gap-6 font-sans">
                        <div class="space-y-1">
                            <div class="text-xs sm:text-sm font-mono text-amber-300 font-bold uppercase">
                                THE "PAPERCLIP MAXIMIZER" TRAP
                            </div>
                            <div class="text-lg sm:text-2xl font-bold text-white">
                                When an AI is only programmed to maximize one goal, it can't choose to stop—even when it costs the whole planet!
                            </div>
                        </div>
                        <button onclick="resetGame()" class="w-full sm:w-auto shrink-0 px-10 py-5 rounded-2xl bg-emerald-400 hover:bg-amber-300 text-black font-mono font-extrabold text-xl transition">
                            PLAY AGAIN &rarr;
                        </button>
                    </div>
                `;
            });
        }

        function resetGame() {
            playTone('pop');
            bootTerminalIntro();
        }

        window.onload = function () {
            bootTerminalIntro();
        };
    </script>
</body>
</html>
