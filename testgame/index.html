<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Absurd Ascent</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="willpower-container">
            <div id="willpower-bar"></div>
        </div>
        
        <div id="quote-container" class="hidden">
            <p id="quote-text"></p>
        </div>

        <button id="brace-btn" 
            onmousedown="startBrace()" onmouseup="stopBrace()" onmouseleave="stopBrace()"
            ontouchstart="startBrace()" ontouchend="stopBrace()">
            HOLD TO BRACE
        </button>
    </div>

    <script src="js/main.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/render.js"></script>
</body>
</html>
